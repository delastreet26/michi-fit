<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Michi Fit">
<meta name="theme-color" content="#FFF4F6"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Michi Fit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen phone app — header, scrolling view, bottom tab bar; workout runs as a full-screen overlay */
:root{
  --bg:#FFF4F6; --surface:#FFFFFF; --sunk:#FFE6EE; --ink:#3B1220; --muted:#8E5E6E; --line:#F6CFDB;
  --pink:#FF8FB1; --pink-soft:#FFD6E3; --red:#E5304B; --red-deep:#B3172F; --on-red:#FFFFFF; --good:#2E9C6A;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif; --body:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
  --r:22px; --shadow:0 6px 22px rgba(179,23,47,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C0C13; --surface:#2A141E; --sunk:#3A1B29; --ink:#FFE8EF; --muted:#CC9CAD; --line:#4A2434;
  --pink:#FF8FB1; --pink-soft:#5A2238; --red:#FF4B63; --red-deep:#FF7A8C; --on-red:#FFFFFF; --good:#5BD49B;
  --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C0C13; --surface:#2A141E; --sunk:#3A1B29; --ink:#FFE8EF; --muted:#CC9CAD; --line:#4A2434;
  --pink:#FF8FB1; --pink-soft:#5A2238; --red:#FF4B63; --red-deep:#FF7A8C; --on-red:#FFFFFF; --good:#5BD49B;
  --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px 110px;display:flex;flex-direction:column;gap:16px}
.view[hidden]{display:none}
.view{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--red-deep)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--sunk);font-weight:800;font-size:14px}
.chip.red{background:var(--red);color:var(--on-red)}

/* header */
.top{display:flex;align-items:center;gap:12px}
.top h1{font-size:26px}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);flex:none}
.iconbtn svg{width:22px;height:22px}

/* mascot */
.cat{width:96px;height:96px;flex:none}
.cat.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
.hello{display:flex;align-items:flex-end;gap:10px}
.bubble{position:relative;background:var(--surface);border-radius:18px 18px 18px 4px;padding:12px 14px;font-weight:700;box-shadow:var(--shadow);flex:1;min-width:0;margin-bottom:18px}

/* today */
.today{background:linear-gradient(150deg,var(--red) 0%,var(--red-deep) 120%);color:var(--on-red);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(229,48,75,.35)}
.today h2{font-size:30px;line-height:1.05}
.today .meta{display:flex;flex-wrap:wrap;gap:8px}
.today .meta span{background:rgba(255,255,255,.2);border-radius:999px;padding:5px 11px;font-weight:800;font-size:13px}
.today .note{font-size:14px;opacity:.95}
.go{background:var(--on-red);color:var(--red-deep);font-family:var(--display);font-size:22px;font-weight:700;border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.go:active{transform:scale(.98)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{flex:none;width:86px;background:#fff;border-radius:14px;padding:4px;color:#3B1220;text-align:center;font-size:11px;font-weight:800;line-height:1.15}
.thumb img{width:100%;aspect-ratio:3/2;object-fit:contain;display:block}
.thumb span{display:block;padding:2px 2px 4px}
.done-banner{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.18);border-radius:16px;padding:10px 12px;font-weight:800}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px;font-weight:800;font-size:13px;color:var(--muted)}
.day .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);font-size:13px}
.day.plan .dot{border-color:var(--pink)}
.day.done .dot{background:var(--red);border:2px solid var(--red);color:var(--on-red)}
.day.sel{background:var(--sunk);color:var(--ink)}
.day.now .dot{box-shadow:0 0 0 3px var(--pink-soft)}

.phase{display:flex;gap:12px;align-items:flex-start}
.phase b{font-family:var(--display);font-weight:600}
details.card summary{font-family:var(--display);font-weight:600;font-size:18px;list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.card summary::after{content:"＋";color:var(--red)}
details[open].card summary::after{content:"－"}
.rules{display:flex;flex-direction:column;gap:8px;margin-top:12px;font-size:15px}
.rules p{margin:0}
.ok{color:var(--good);font-weight:800}.no{color:var(--red);font-weight:800}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);box-shadow:0 -4px 20px rgba(179,23,47,.10);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs .in{max-width:520px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}
/* fotos */
.pslots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pslot{aspect-ratio:3/4;border-radius:18px;border:2px dashed var(--pink);background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;color:var(--red-deep);overflow:hidden;position:relative;padding:0}
.pslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pslot .lbl{position:absolute;left:8px;bottom:8px;background:rgba(27,16,20,.65);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
.pslot.has{border:0}
.pslot svg{width:34px;height:34px}
.ba{position:relative;aspect-ratio:3/4;border-radius:20px;overflow:hidden;background:var(--sunk);touch-action:pan-y}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ba .after{clip-path:inset(0 0 0 50%)}
.ba .line{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.35);pointer-events:none}
.ba .line::after{content:"⟷";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-weight:800;box-shadow:var(--shadow)}
.ba .tagL,.ba .tagR{position:absolute;top:10px;background:rgba(27,16,20,.65);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;pointer-events:none}
.ba .tagL{left:10px}.ba .tagR{right:10px}
.wkrow{display:grid;grid-template-columns:64px 1fr 1fr;gap:8px;align-items:center}
.wkrow .mini{aspect-ratio:3/4;border-radius:12px;background:var(--sunk);border:2px dashed var(--line);overflow:hidden;padding:0;position:relative}
.wkrow .mini img{width:100%;height:100%;object-fit:cover;display:block}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px}
.seg button.on{background:var(--red);color:var(--on-red)}
.pick{font:inherit;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--surface);color:var(--ink)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:800;color:var(--muted)}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--red)}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head h2{font-size:22px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:12px;font-weight:800;color:var(--muted);padding:4px 0}
.cd{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;position:relative}
.cd.out{visibility:hidden}
.cd.plan{border:2px dashed var(--pink-soft)}
.cd.miss{color:var(--muted);opacity:.55}
.cd.done{background:var(--red);color:var(--on-red)}
.cd.now{box-shadow:inset 0 0 0 3px var(--pink)}
.cd .star{position:absolute;top:1px;right:3px;font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);font-weight:700}
.legend i{display:inline-block;width:14px;height:14px;border-radius:5px;vertical-align:-2px;margin-right:4px}
.milestone{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.milestone:first-child{border-top:0}
.milestone .when{font-weight:800;min-width:86px;color:var(--red-deep)}
.milestone.past .when{color:var(--good)}

/* stats & charts */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.tile .v{font-family:var(--display);font-size:32px;font-weight:700;line-height:1;color:var(--red)}
.tile .k{font-size:13px;font-weight:800;color:var(--muted);margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:8px 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:800;font-size:13px}
.chips button.on{background:var(--red);color:var(--on-red)}
.chips button.empty{opacity:.5}
svg.chart{width:100%;height:auto;display:block}
.compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.compare .big{font-family:var(--display);font-size:24px;font-weight:700}
.compare .arrow{font-size:24px;color:var(--red)}

/* trophies */
.trophies{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tro{background:var(--surface);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px}
.tro .medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 35% 30%,#FFD1DE,var(--pink) 60%,var(--red) 100%)}
.tro b{font-size:13px;line-height:1.15}
.tro .small{font-size:11px;line-height:1.2}
.tro.locked .medal{background:var(--sunk);filter:grayscale(1);opacity:.55}
.tro.locked b{color:var(--muted)}

/* sheet / modal */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(40,8,18,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h2{font-size:24px}
.frames{position:relative;background:#fff;border-radius:20px;overflow:hidden;aspect-ratio:32/22;max-width:100%}
.frames img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.frames img.b{animation:swap 2.6s ease-in-out infinite}
@keyframes swap{0%,35%{opacity:0}50%,85%{opacity:1}100%{opacity:0}}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.btn{border-radius:16px;padding:14px;font-weight:800;text-align:center;background:var(--surface);box-shadow:var(--shadow)}
.btn.primary{background:var(--red);color:var(--on-red)}
.btn.danger{color:var(--red)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:14px}
.field input,.field textarea{font:inherit;font-weight:700;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.toggle{display:flex;justify-content:space-between;align-items:center;font-weight:800;padding:6px 0}
.sw{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sw.on{background:var(--red)}.sw.on::after{left:23px}

/* steppers */
.steps{display:flex;flex-direction:column;gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border-radius:16px;padding:8px}
.stepper .lab{font-weight:800;font-size:14px;color:var(--muted);padding-left:6px;min-width:0}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper button{width:46px;height:46px;border-radius:14px;background:var(--sunk);font-size:24px;font-weight:800;color:var(--red-deep)}
.stepper .val{min-width:84px;text-align:center;font-family:var(--display);font-size:24px;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags button{padding:8px 12px;border-radius:999px;background:var(--surface);font-weight:800;font-size:13px;border:2px solid var(--line)}
.tags button.on{background:var(--pink-soft);border-color:var(--pink);color:var(--ink)}

/* workout overlay */
#run{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));gap:10px;transition:background .4s}
#run.work{background:linear-gradient(180deg,var(--pink-soft),var(--bg) 45%)}
#run .bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;flex:1}
#run .bar i{display:block;height:100%;background:var(--red);border-radius:999px;transition:width .3s}
.pill{align-self:flex-start;padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase;background:var(--sunk);color:var(--red-deep)}
.pill.work{background:var(--red);color:var(--on-red)}
.pill.rest{background:var(--pink);color:#3B1220}
#run h2{font-size:28px;line-height:1.05}
#run .rx{font-weight:800;color:var(--muted)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;justify-content:center;max-width:520px;width:100%;margin:0 auto}
.stage .frames{width:100%;max-height:34vh}
.ringrow{display:flex;align-items:center;justify-content:center;gap:16px}
.ring{position:relative;width:min(44vw,190px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:min(16vw,68px)}
.tip{background:var(--surface);border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.controls{display:flex;justify-content:center;align-items:center;gap:22px}
.controls button{width:58px;height:58px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.controls button.main{width:76px;height:76px;background:var(--red);color:var(--on-red)}
.controls svg{width:28px;height:28px}
.logcard{background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.logcard .stepper{background:var(--sunk)}
.logcard .stepper button{background:var(--surface)}
.next{display:flex;align-items:center;gap:10px;font-weight:800}
.next img{width:84px;border-radius:12px;background:#fff;aspect-ratio:3/2;object-fit:contain}
.runcat{display:flex;align-items:center;gap:8px}
.runcat .cat{width:62px;height:62px}
.runcat .bubble{margin:0;font-size:14px;padding:8px 12px}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;box-shadow:var(--shadow);max-width:90%}
.confirm{display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.frames img.b{opacity:.0}}
</style>

<div id="app">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-cal" hidden></section>
  <section class="view" id="v-prog" hidden></section>
  <section class="view" id="v-fotos" hidden></section>
  <section class="view" id="v-tro" hidden></section>
</div>
<nav class="tabs"><div class="in">
  <button class="tab on" data-act="tab" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Hoy</button>
  <button class="tab" data-act="tab" data-v="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</button>
  <button class="tab" data-act="tab" data-v="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l5-5 4 3 6-7"/></svg>Progreso</button>
  <button class="tab" data-act="tab" data-v="fotos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Fotos</button>
  <button class="tab" data-act="tab" data-v="tro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 21h8M9 18h6"/></svg>Trofeos</button>
</div></nav>
<div id="run" hidden></div>
<div id="sheet"></div>

/* ───── Construcción de la sesión (30 min exactos) ───── */
function exName(id,P){const x=P&&P.ex&&P.ex[id];return(x&&x.name)||EX[id].n}
function buildSteps(dk,dateIso){
  const D=DAYS[dk],st=[],P=PHASES[phaseIdx(dateIso)],W=P.w,Rr=60-W;
  const swp=(E,id)=>E.side&&E.u==='reps/pierna'||(P.ex&&P.ex[id]&&/pierna/.test(P.ex[id].rx||''))?Math.round(W/2):0;
  D.warm.forEach(([l,ex])=>st.push({k:'warm',d:60,label:l,ex}));
  D.blocks.forEach((b0,bi)=>{
    const b=b0.m?applyPhase(b0,P):b0;
    if(b.m){
      const id=b.m,E=EX[id],nm=exName(id,P);
      if(id===10){for(let s=1;s<=3;s++){st.push({k:'work',d:20,ex:id,label:nm,sub:'Lado izquierdo · ronda '+s+' de 3',rx:b.rx,ld:b.ld,tip:b.tip,bi});st.push({k:'rest',d:10,bi});st.push({k:'work',d:20,ex:id,label:nm,sub:'Lado derecho · ronda '+s+' de 3',rx:b.rx,ld:b.ld,tip:b.tip,bi});st.push({k:'rest',d:10,bi,log:s===3?id:0,goal:b.rx})}}
      else for(let s=1;s<=3;s++){st.push({k:'work',d:W,ex:id,label:nm,sub:'Serie '+s+' de 3',rx:b.rx,ld:b.ld,tip:b.tip,sw:swp(E,id),set:s,bi});st.push({k:'rest',d:Rr,bi,log:s===3?id:0,goal:b.rx+(b.ld?' · '+b.ld:'')})}
    }else if(b.c){
      const seq=b.c.length===2?[b.c[0],b.c[1],b.c[0]]:b.c;
      seq.forEach((id,j)=>{st.push({k:'work',d:W,ex:id,label:exName(id,P),sub:'🔥 Combo · '+(j+1)+' de 3',combo:1,bi,sw:swp(EX[id],id),set:j+1,tip:applyPhase({m:id},P).tip});st.push({k:'rest',d:Rr,bi})});
    }else if(b.f){
      for(let s=1;s<=3;s++){st.push({k:'work',d:W,ex:b.f,label:b.label,sub:'Remate · '+s+' de 3',tip:b.tip,bi,set:s});st.push({k:'rest',d:Rr,bi})}
    }
  });
  st.push({k:'cool',d:60,label:D.cool});
  st.push({k:'cool',d:60,label:'Respira hondo y suelta todo 😌'});
  return st;
}

const doneDates=()=>new Set(S.sessions.filter(s=>s.ok).map(s=>s.date));
function lastLog(id){for(let i=S.sessions.length-1;i>=0;i--){const l=S.sessions[i].logs&&S.sessions[i].logs[id];if(l)return l}return null}
function firstLog(id){for(const s of S.sessions){const l=s.logs&&s.logs[id];if(l)return l}return null}
function defLog(id){const E=EX[id],L=lastLog(id);return{r:L?L.r:E.r,w:L?L.w:(E.w||0),tags:[]}}
function streak(){
  const dd=doneDates();let d=new Date(),n=0;
  if(dowM(d)<5&&!dd.has(iso(d)))d=addD(d,-1);
  for(let i=0;i<400;i++){if(dowM(d)<5){if(dd.has(iso(d)))n++;else break}d=addD(d,-1)}
  return n;
}
function bestStreak(){
  const dd=doneDates();if(!dd.size)return 0;
  const ds=[...dd].sort();let d=parse(ds[0]),end=new Date(),best=0,cur=0;
  while(d<=end){if(dowM(d)<5){if(dd.has(iso(d))){cur++;best=Math.max(best,cur)}else if(iso(d)!==iso(end))cur=0}d=addD(d,1)}
  return best;
}

function tone(f,t=0,d=.15,type='sine',v=.25,f2){const a=ac();if(!a||!S.settings.sound)return;const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+.05)}
const snd={
 tick:()=>tone(740,0,.12,'triangle',.3),
 go:()=>{tone(880,0,.12,'triangle',.3);tone(1320,.12,.28,'triangle',.3)},
 rest:()=>{tone(784,0,.16,'sine',.25);tone(523,.16,.3,'sine',.25)},
 swap:()=>{tone(1046,0,.08,'square',.12);tone(1046,.12,.08,'square',.12)},
 win:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,i*.11,.32,'triangle',.25)),
 meow:()=>{const a=ac();if(!a||!S.settings.sound)return;const t=a.currentTime,o=a.createOscillator(),fl=a.createBiquadFilter(),g=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(520,t);o.frequency.linearRampToValueAtTime(920,t+.18);o.frequency.linearRampToValueAtTime(560,t+.55);fl.type='bandpass';fl.frequency.setValueAtTime(1100,t);fl.frequency.linearRampToValueAtTime(1800,t+.2);fl.frequency.linearRampToValueAtTime(900,t+.55);fl.Q.value=4;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.06);g.gain.linearRampToValueAtTime(.35,t+.35);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(fl).connect(g).connect(a.destination);o.start(t);o.stop(t+.65)},
};
let esVoice=null;
function speak(txt){if(!S.settings.voice||!('speechSynthesis' in window))return;try{const u=new SpeechSynthesisUtterance(txt);if(!esVoice){const vs=speechSynthesis.getVoices();esVoice=vs.find(v=>v.lang==='es-ES')||vs.find(v=>v.lang&&v.lang.startsWith('es'))||null}if(esVoice)u.voice=esVoice;u.lang='es-ES';u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

function confetti(){const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);const x=c.getContext('2d'),W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio,cols=['#E5304B','#FF8FB1','#FFD6E3','#B3172F','#ffffff','#1B1014'];const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.03-H*.008,s:(6+Math.random()*8)*devicePixelRatio,c:pick(cols),r:Math.random()*6,vr:(Math.random()-.5)*.3,h:Math.random()<.3}));let t=0;(function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=H*.0009;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;if(p.h){x.beginPath();x.arc(0,0,p.s/2,0,7);x.fill()}else x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++t<170)requestAnimationFrame(f);else c.remove()})()}

function phaseCard(){
  const now=parse(iso(new Date())),st=parse(S.settings.start),xm=parse(XMAS),pi=phaseIdx(),P=PHASES[pi];
  const total=Math.round((xm-st)/864e5),gone=Math.max(0,Math.min(total,Math.round((now-st)/864e5))),left=Math.round((xm-now)/864e5);
  const before=now<st;
  return`<div class="card" style="display:flex;flex-direction:column;gap:10px">
   <div class="row between"><div class="eyebrow">Plan hasta Navidad</div><span class="small muted num">${before?'Empieza el '+nice(S.settings.start):left>0?'🎄 faltan '+left+' días':'🎄 ¡Navidad!'}</span></div>
   <div class="row" style="gap:12px"><span style="font-size:34px">${P.e}</span><div style="min-width:0"><b style="font-family:var(--display);font-size:19px">Fase ${pi+1} de ${PHASES.length} · ${P.n}</b><div class="small muted">${before?'Primera fase: '+P.goal:P.goal}</div></div></div>
   <div style="display:grid;grid-template-columns:repeat(${PHASES.length},1fr);gap:4px">${PHASES.map((x,i)=>`<div title="${x.n}" style="height:10px;border-radius:999px;background:${i<pi||(!before&&i===pi&&false)?'var(--red)':i===pi&&!before?'linear-gradient(90deg,var(--red) '+Math.round(100*((gone-14*i)/14))+'%,var(--sunk) 0)':'var(--sunk)'}"></div>`).join('')}</div>
   <div class="row between small muted" style="font-weight:800">${PHASES.map((x,i)=>`<span style="${i===pi?'color:var(--red)':''}">${x.e}</span>`).join('')}</div>

let R=null,timer=null;
function startWorkout(dk,resume){
  ac();snd.tick();lockScreen();
  if(resume){R=resume}else{R={dk,i:0,ends:Date.now()+60000,paused:0,left:0,logs:{},start:Date.now(),date:iso(new Date())}}
  R.steps=buildSteps(R.dk,R.date);
  document.getElementById('run').hidden=false;document.body.style.overflow='hidden';
  renderStep(true);clearInterval(timer);timer=setInterval(tick,200);
}
function persistRun(){S.active={dk:R.dk,i:R.i,ends:R.ends,paused:R.paused,left:R.left,logs:R.logs,start:R.start,date:R.date};save()}
function stepLeft(){return R.paused?R.left:(R.ends-Date.now())/1000}
function totalLeft(){let t=stepLeft();for(let j=R.i+1;j<R.steps.length;j++)t+=R.steps[j].d;return t}
let lastSec=null,swDone=false;
function tick(){
  if(!R)return;let left=stepLeft();
  while(!R.paused&&left<=0){if(R.i>=R.steps.length-1){finish();return}R.i++;R.ends+=R.steps[R.i].d*1000;left=stepLeft();renderStep()}
  const s=Math.ceil(left),st=R.steps[R.i];
  if(s!==lastSec&&!R.paused){
    if(s<=3&&s>=1)snd.tick();
    if(st.sw&&!swDone&&left<=st.d-st.sw){swDone=true;snd.swap();speak('Cambia de pierna');document.getElementById('rsub').textContent=st.sub+' · ¡Cambia de pierna!'}
    lastSec=s;
  }
  const el=document.getElementById('rt');if(el)el.textContent=s>=60?fmt(s):s;
  const ring=document.getElementById('rring');if(ring)ring.style.strokeDashoffset=String(339.3*(1-Math.max(0,left)/st.d));
  const tot=R.steps.reduce((a,x)=>a+x.d,0),tl=totalLeft();
  const b=document.getElementById('rbar');if(b)b.style.width=(100*(1-tl/tot))+'%';
  const tt=document.getElementById('rtot');if(tt)tt.textContent=fmt(tl);
}
function nextWork(i){for(let j=i+1;j<R.steps.length;j++)if(R.steps[j].k==='work')return R.steps[j];return null}
function renderStep(first){
  const st=R.steps[R.i],run=document.getElementById('run');swDone=false;lastSec=null;persistRun();
  run.className=st.k==='work'?'work':'';
  const pillTxt={warm:'Calentamiento',work:'¡A trabajar!',rest:'Descansa',cool:'Vuelta a la calma'}[st.k];
  let head,body='';
  if(st.k==='rest'){
    const nx=nextWork(R.i);
    head=`<h2>Descansa</h2><div class="rx">${nx?'Siguiente: '+esc(nx.label):'Ya casi está'}</div>`;
    if(st.log)body+=logCard(st.log,null,st.goal);
    else if(nx&&nx.ex)body+=`<div class="next"><img src="${IMG[nx.ex].b}" alt=""><div><div class="small muted">Siguiente</div>${esc(nx.label)}<div class="small muted">${esc(nx.sub||'')}</div></div></div>`;
    if(!st.log)body+=`<div class="runcat">${cat('wink','cat')}<div class="bubble">${pick(PHRASES.rest)}</div></div>`;
  }else{
    head=`<h2>${esc(st.label)}</h2><div class="rx" id="rsub">${esc(st.sub||(st.k==='warm'?'1 minuto, suave':'1 minuto'))}</div>`;
    if(st.ex)body+=frames(st.ex,true);
    else body+=`<div class="runcat" style="justify-content:center">${cat(st.k==='cool'?'sleep':'happy','cat bob')}</div>`;
    const E=st.ex&&EX[st.ex];
    const tip=st.tip||(st.k==='work'&&E?E.cues[E.cues.length>2?1:0]:'');
    if(st.k==='work'&&(st.rx||tip))body+=`<div class="tip">${st.rx?`<b>${esc(st.rx)}</b> · ${esc(st.ld||'')}<br>`:''}💡 ${esc(tip)}</div>`;
  }
  const col=st.k==='work'?'var(--red)':st.k==='rest'?'var(--pink)':'var(--red-deep)';
  run.innerHTML=`<div class="row"><button class="iconbtn" data-act="quit" aria-label="Salir">✕</button><div class="bar"><i id="rbar"></i></div><span class="num" style="font-weight:800" id="rtot"></span></div>
   <div class="stage"><span class="pill ${st.k}">${pillTxt}</span>${head}${body}
   <div class="ringrow"><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" stroke="var(--sunk)" stroke-width="10" fill="none"/><circle id="rring" cx="60" cy="60" r="54" stroke="${col}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0"/></svg><div class="t num" id="rt"></div></div></div></div>
   <div class="controls"><button data-act="prev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
   <button class="main" data-act="pause" aria-label="Pausa">${R.paused?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>'}</button>
   <button data-act="skip" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button></div>`;
  if(!first||R.i>0){
    if(st.k==='work'){snd.go();const p=R.steps[R.i-1];speak(p&&p.k==='rest'&&p.bi===st.bi&&!st.combo?'Serie '+st.set:st.label)}
    else if(st.k==='rest'){snd.rest();speak(st.log?'Descansa. Apunta tus repeticiones':'Descansa')}
    else if(st.k==='cool'){snd.rest();speak(st.label)}
    else speak(st.label);
  }else speak(st.label);
  tick();
}
function stepperHTML(key,lab,val){return`<div class="stepper"><span class="lab">${lab}</span><div class="ctl"><button data-act="step" data-k="${key}" data-dir="-1" aria-label="Menos">−</button><span class="val num" id="val-${key.replace(/[^a-z0-9]/gi,'_')}">${val}</span><button data-act="step" data-k="${key}" data-dir="1" aria-label="Más">+</button></div></div>`}
const wTxt=(E,w)=>w>0?(E.dual?w+' kg c/u':w+' kg'):'Sin peso';
function logCard(id,target,goal){
  const E=EX[id],logs=target||R.logs;if(!logs[id])logs[id]=defLog(id);const L=logs[id];
  const prev=lastLog(id),hint=prev&&prev.r>=15&&E.t!=='sec'?`<div class="small"><b>💡 La última vez hiciste ${prev.r}.</b> Prueba pausa arriba, más lento${E.t==='band'?' o banda más dura':' o un poco más de peso'}.</div>`:'';
  const tags=E.t==='band'?['Banda más dura','Pausa arriba','Lento']:E.t==='sec'?[]:['Pausa arriba','Lento'];
  const pfx=target?'s:':'r:';
  return`<div class="logcard"><div class="row between"><b>📝 ${esc(exName(id,PHASES[phaseIdx(target?SUM.date:R.date)]))}</b><span class="small muted">se guarda solo</span></div>
   ${goal?`<div class="small">🎯 <b>Objetivo de esta fase:</b> ${esc(goal)}</div>`:''}
   ${stepperHTML(pfx+id+':r',E.t==='sec'?'Segundos/lado':'Reps'+(E.u&&E.u!=='s/lado'?' '+E.u.replace('reps',''):''),L.r)}
   ${E.t==='kg'||E.t==='kgopt'?stepperHTML(pfx+id+':w','Peso',wTxt(E,L.w)):''}
   ${tags.length?`<div class="tags">${tags.map(t=>`<button class="${(L.tags||[]).includes(t)?'on':''}" data-act="tag" data-k="${pfx+id}" data-t="${t}">${t}</button>`).join('')}</div>`:''}${hint}</div>`;
}
function logsFor(pfx){return pfx==='r'?R.logs:(SUM&&SUM.logs)}
function doStep(key,dir){
  const[p,id,f]=key.split(':'),logs=logsFor(p),E=EX[id],L=logs[id];
  if(f==='r')L.r=Math.max(0,L.r+dir);else L.w=Math.max(0,Math.round((L.w+dir*(E.t==='kgopt'&&L.w===0&&dir>0&&id==3?10:0.5))*10)/10);
  if(f==='w'&&id==3&&dir<0&&L.w<10)L.w=0;
  const el=document.getElementById('val-'+key.replace(/[^a-z0-9]/gi,'_'));if(el)el.textContent=f==='r'?L.r:wTxt(E,L.w);
  if(p==='r')persistRun();else saveSum();
}
function togglePause(){if(R.paused){R.ends=Date.now()+R.left*1000;R.paused=0}else{R.left=stepLeft();R.paused=1}persistRun();renderStep(true)}
function jump(d){
  if(d>0){R.i=Math.min(R.steps.length-1,R.i+1)}else{if(stepLeft()<R.steps[R.i].d-3||R.i===0){}else R.i=Math.max(0,R.i-1)}
  R.ends=Date.now()+R.steps[R.i].d*1000;R.left=R.steps[R.i].d;renderStep();
}
function quitAsk(){
  const elapsed=R.steps.slice(0,R.i).reduce((a,x)=>a+x.d,0);
  openSheet(`<div class="confirm"><div class="row">${cat('look','cat')}<h2>¿Terminar ya?</h2></div><p class="muted" style="margin:0">${elapsed>=900?'Llevas '+Math.round(elapsed/60)+' minutos: se guardará como entreno.':'Llevas menos de 15 minutos, así que no se guardará.'}</p>
   <button class="btn primary" data-act="closeSheet">Seguir entrenando</button><button class="btn danger" data-act="quitYes">Terminar</button></div>`);
}
function stopRun(){clearInterval(timer);timer=null;try{wake&&wake.release()}catch(e){}wake=null;try{speechSynthesis.cancel()}catch(e){}delete S.active;save();document.getElementById('run').hidden=true;document.body.style.overflow=''}
function quitYes(){closeSheet();const elapsed=R.steps.slice(0,R.i).reduce((a,x)=>a+x.d,0);if(elapsed>=900){finish(elapsed)}else{stopRun();R=null;renderAll()}}

/* ───── Resumen ───── */
let SUM=null;
function finish(partial){
  const secs=partial||R.steps.reduce((a,x)=>a+x.d,0);
  const rec={id:Date.now(),date:R.date,ts:R.start,dk:R.dk,secs,ok:true,logs:R.logs,feel:null};
  S.sessions.push(rec);S.sessions.sort((a,b)=>a.ts-b.ts);stopRun();R=null;
  const nw=checkTrophies();save();snd.win();setTimeout(snd.meow,700);speak(pick(['¡Entreno completado! Eres increíble','¡Miau! Lo has conseguido']));confetti();

}

   <div class="card"><b>¿Qué tal la espalda?</b><div class="tags" style="margin-top:10px">${[['good','😺 Genial'],['ok','🙂 Normal'],['pain','😿 Me molestó']].map(([k,t])=>`<button data-act="feel" data-f="${k}" class="${SUM.feel===k?'on':''}">${t}</button>`).join('')}</div><div id="feelmsg"></div></div>

let calM=null;

  const dd=doneDates(),y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1),off=dowM(first),days=new Date(y,m+1,0).getDate();

   <div class="legend" style="margin-top:12px"><span><i style="background:var(--red)"></i>Entrenado</span><span><i style="border:2px dashed var(--pink)"></i>Toca entrenar</span><span>⭐ Hito</span></div></div>
   <div class="card"><div class="eyebrow">Tu camino hasta Navidad</div><div style="margin-top:6px">${allMilestones().map(([k,t,d])=>`<div class="milestone ${parse(k)<=tdate?'past':''}"><span class="when">${parse(k)<=tdate?'✓ ':''}${nice(k)}</span><div><b>${t}</b><div class="small muted">${d}</div></div></div>`).join('')}</div></div>`;

/* ───── PROGRESO ───── */
let progEx=null;
function series(id,f){return S.sessions.filter(s=>s.logs&&s.logs[id]).map(s=>({d:s.date,y:s.logs[id][f]}))}
function chart(pts,o={}){
  if(pts.length<1)return'';
  const W=340,H=170,pl=34,pr=14,pt=22,pb=26;
  const ys=pts.map(p=>p.y),mn=Math.min(...ys),mx=Math.max(...ys);
  let lo=Math.floor(Math.max(0,mn-2)),hi=Math.ceil(mx+2);if(hi-lo<4)hi=lo+4;
  const X=i=>pts.length===1?(pl+W-pr)/2:pl+i*(W-pl-pr)/(pts.length-1),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const ticks=[lo,Math.round((lo+hi)/2),hi];
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=line+` L${X(pts.length-1).toFixed(1)} ${H-pb} L${X(0).toFixed(1)} ${H-pb}Z`;
  const L=pts[pts.length-1];
  return`<div class="card"><div class="row between"><b>${o.title||'Repeticiones'}</b><span class="small muted">${pts.length} registro${pts.length>1?'s':''}</span></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.title||'Repeticiones'}">
   ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-weight="700">${t}</text>`).join('')}
   <path d="${area}" fill="var(--pink-soft)" opacity=".8"/>
   <path d="${line}" fill="none" stroke="var(--red)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===pts.length-1?5.5:3}" fill="${i===pts.length-1?'var(--red)':'var(--surface)'}" stroke="var(--red)" stroke-width="2"/>`).join('')}
   <text x="${Math.min(X(pts.length-1),W-pr-4)}" y="${Y(L.y)-10}" text-anchor="${pts.length===1?'middle':'end'}" font-size="13" font-weight="800" fill="var(--ink)">${L.y}${o.unit==='kg'?' kg':''}</text>
   <text x="${X(0)}" y="${H-6}" font-size="11" fill="var(--muted)" font-weight="700" text-anchor="${pts.length===1?'middle':'start'}">${nice(pts[0].d)}</text>
   ${pts.length>1?`<text x="${X(pts.length-1)}" y="${H-6}" font-size="11" fill="var(--muted)" font-weight="700" text-anchor="end">${nice(L.d)}</text>`:''}
  </svg></div>`;
}
function compare(id){
  const E=EX[id],f=firstLog(id),l=lastLog(id);if(!f)return'';
  const t=x=>`${x.r}${E.t==='sec'?' s':''}${E.t==='kg'||E.t==='kgopt'?' × '+(x.w>0?x.w+' kg':'sin peso'):''}`;
  return`<div class="compare" style="margin-top:8px"><div><div class="small muted">Empezaste</div><div class="big num">${t(f)}</div></div><div class="arrow">→</div><div><div class="small muted">Ahora</div><div class="big num" style="color:var(--red)">${t(l)}${(l.tags||[]).length?`<div class="small muted">${l.tags.join(' · ')}</div>`:''}</div></div></div>`;
}
function weeklyBars(){
  const now=new Date(),ws=weekStart(now),wks=[];
  for(let i=7;i>=0;i--){const a=addD(ws,-7*i),b=addD(a,7);wks.push({a,m:Math.round(S.sessions.filter(s=>{const d=parse(s.date);return d>=a&&d<b}).reduce((x,s)=>x+(s.secs||0),0)/60)})}
  const W=340,H=150,pb=24,pt=20,mx=Math.max(150,...wks.map(w=>w.m)),bw=(W-20)/8;
  return`<div class="card"><div class="row between"><b>Minutos por semana</b><span class="small muted">objetivo 150</span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutos por semana">
   <line x1="10" x2="${W-10}" y1="${pt+(H-pt-pb)*(1-150/mx)}" y2="${pt+(H-pt-pb)*(1-150/mx)}" stroke="var(--pink)" stroke-dasharray="4 4" stroke-width="1.5"/>
   ${wks.map((w,i)=>{const h=(H-pt-pb)*w.m/mx,x=10+i*bw+bw*.18;return`<rect x="${x}" y="${H-pb-h}" width="${bw*.64}" height="${Math.max(h,2)}" rx="6" fill="${i===7?'var(--red)':'var(--pink)'}"/>${w.m?`<text x="${x+bw*.32}" y="${H-pb-h-5}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--ink)">${w.m}</text>`:''}<text x="${x+bw*.32}" y="${H-7}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--muted)">${i===7?'esta':w.a.getDate()+'/'+(w.a.getMonth()+1)}</text>`}).join('')}
  </svg></div>`;
}
function renderProg(){
  const ids=Object.keys(EX).map(Number),has=id=>S.sessions.some(s=>s.logs&&s.logs[id]);
  if(!progEx)progEx=ids.find(has)||1;
  const E=EX[progEx],any=S.sessions.length>0;
  let h=`<div class="top"><h1 style="flex:1">Progreso</h1></div>
   <div class="tiles"><div class="tile"><div class="v num">${okN()}</div><div class="k">Entrenos</div></div><div class="tile"><div class="v num">${mins()}</div><div class="k">Minutos</div></div><div class="tile"><div class="v num">🔥 ${streak()}</div><div class="k">Racha actual</div></div><div class="tile"><div class="v num">${bestStreak()}</div><div class="k">Mejor racha</div></div></div>`;
  if(!any)h+=`<div class="card hello" style="align-items:center">${cat('look','cat')}<div><b>Aquí verás cómo mejoras.</b><div class="small muted">Haz tu primer entreno y apunta tus repeticiones al final de cada ejercicio. En 3–4 semanas podrás decir: “empecé con 12 puentes y ahora hago 15 con pausa y banda”.</div></div></div>`;
  h+=weeklyBars();
  h+=`<div class="chips">${ids.map(id=>`<button class="${id===progEx?'on':''} ${has(id)?'':'empty'}" data-act="progEx" data-id="${id}">${EX[id].n}</button>`).join('')}</div>`;
  if(has(progEx)){
    h+=`<div class="card"><div class="row between"><b>${E.n}</b><button class="small" style="color:var(--red);font-weight:800" data-act="ex" data-id="${progEx}">Ver cómo se hace</button></div>${compare(progEx)}</div>`;
    h+=chart(series(progEx,'r'),{title:E.t==='sec'?'Segundos por lado':'Repeticiones',unit:'reps'});
    if(E.t==='kg'||E.t==='kgopt')h+=chart(series(progEx,'w'),{title:'Peso (kg'+(E.dual?' por mancuerna':'')+')',unit:'kg'});
  }else h+=`<div class="card muted small">Todavía no has apuntado <b>${E.n}</b>. Aparecerá aquí después de hacerlo.</div>`;
  document.getElementById('v-prog').innerHTML=h;
}

/* ───── FOTOS (IndexedDB, solo en este dispositivo) ───── */
let PH={},photosReady=false,photoTarget=null,baSide='front',baA=null,baB=null;
const URLS={};
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('michi-fit-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'k'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbAll(){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('photos').objectStore('photos').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbPut(o){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('photos','readwrite');t.objectStore('photos').put(o);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbDel(k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('photos','readwrite');t.objectStore('photos').delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function setPhoto(o){if(URLS[o.k])URL.revokeObjectURL(URLS[o.k]);URLS[o.k]=URL.createObjectURL(o.blob);PH[o.k]={url:URLS[o.k],ts:o.ts}}
async function loadPhotos(){try{(await idbAll()).forEach(setPhoto)}catch(e){}photosReady=true;renderAll()}
async function delPhoto(k){try{await idbDel(k)}catch(e){}if(URLS[k])URL.revokeObjectURL(URLS[k]);delete URLS[k];delete PH[k]}
function photoWeek(){return Math.max(1,weekNo())}
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=1400,sc=Math.min(1,m/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.82)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
document.getElementById('photo-input').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];if(!f||!photoTarget)return;
  try{const blob=await shrink(f),o={k:photoTarget,blob,ts:Date.now()};await idbPut(o);setPhoto(o);const nw=checkTrophies();renderAll();toast('📸 ¡Foto guardada!');if(nw.length){confetti();snd.win()}}
  catch(err){toast('No se ha podido guardar la foto. Inténtalo otra vez.')}
});
const sideTxt={front:'De frente',back:'De espaldas'};
const camIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
function slot(k){const p=PH[k],side=k.split('-')[1];return p?`<button class="pslot has" data-act="photoView" data-k="${k}"><img src="${p.url}" alt="${sideTxt[side]}"><span class="lbl">${sideTxt[side]}</span></button>`:`<button class="pslot" data-act="photoAdd" data-k="${k}">${camIcon}<span>${sideTxt[side]}</span><span class="small muted">Toca para añadir</span></button>`}
function viewPhoto(k){const p=PH[k];if(!p)return;const[w,side]=k.split('-');
  openSheet(`<div class="row between"><h2>Semana ${w} · ${sideTxt[side]}</h2><button class="iconbtn" data-act="closeSheet">✕</button></div>
   <img src="${p.url}" alt="" style="width:100%;border-radius:18px">
   <p class="small muted" style="margin:0">${nice(iso(new Date(p.ts)))} · Mantén pulsada la foto para guardarla en tu carrete.</p>
   <button class="btn" data-act="photoAdd" data-k="${k}">Cambiar foto</button><button class="btn danger" data-act="photoDelAsk" data-k="${k}">Borrar</button>`)}
function renderFotos(){
  const pw=photoWeek(),weeksWith=[...new Set(Object.keys(PH).map(k=>+k.split('-')[0]))].sort((a,b)=>a-b);
  let h=`<div class="top"><div style="flex:1"><h1>Fotos</h1><div class="small muted">Frente y espaldas, una vez por semana</div></div><span class="chip red num">📸 ${weeksWith.length}</span></div>`;
  h+=`<div class="card" style="display:flex;flex-direction:column;gap:12px"><div><div class="eyebrow">Esta semana</div><b style="font-family:var(--display);font-size:20px">Semana ${pw}${pw===1?' · foto de inicio':''}</b></div>
   <div class="pslots">${slot(pw+'-front')}${slot(pw+'-back')}</div>
   <div class="small muted">💡 Mismo sitio, misma luz y misma ropa, y mejor el mismo día (por ejemplo, el lunes por la mañana). Así el cambio se ve de verdad.</div></div>`;
  const sides=weeksWith.filter(w=>PH[w+'-'+baSide]);
  if(sides.length>=2){
    if(!sides.includes(baA))baA=sides[0];if(!sides.includes(baB)||baB===baA)baB=sides[sides.length-1];
    const opt=sel=>sides.map(w=>`<option value="${w}" ${w===sel?'selected':''}>Sem. ${w}</option>`).join('');
    h+=`<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="row between" style="flex-wrap:wrap"><b style="font-family:var(--display);font-size:20px">Antes y ahora ✨</b><div class="seg"><button class="${baSide==='front'?'on':''}" data-act="baSide" data-s="front">Frente</button><button class="${baSide==='back'?'on':''}" data-act="baSide" data-s="back">Espaldas</button></div></div>
     <div class="row between"><label class="small muted" for="ba-a">Antes <select class="pick" id="ba-a">${opt(baA)}</select></label><label class="small muted" for="ba-b">Ahora <select class="pick" id="ba-b">${opt(baB)}</select></label></div>
     <div class="ba" id="ba"><img src="${PH[baA+'-'+baSide].url}" alt="Antes"><img class="after" id="ba-after" src="${PH[baB+'-'+baSide].url}" alt="Ahora"><div class="line" id="ba-line"></div><span class="tagL">Sem. ${baA}</span><span class="tagR">Sem. ${baB}</span></div>
     <div class="small muted" style="text-align:center">Desliza el dedo sobre la foto para comparar</div></div>`;
  }else h+=`<div class="card hello" style="align-items:center">${cat('look','cat')}<div><b>Aquí podrás comparar el antes y el después.</b><div class="small muted">En cuanto tengas fotos de 2 semanas distintas, aparecerá una comparación que se desliza con el dedo.</div></div></div>`;
  const last=Math.max(pw,...weeksWith);
  h+=`<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow">Todas las semanas</div>${Array.from({length:last},(_,i)=>last-i).map(w=>`<div class="wkrow"><div><b>Sem. ${w}</b><div class="small muted">${nice(iso(addD(parse(S.settings.start),(w-1)*7)))}</div></div>${['front','back'].map(sd=>{const k=w+'-'+sd,p=PH[k];return p?`<button class="mini" data-act="photoView" data-k="${k}"><img src="${p.url}" alt="${sideTxt[sd]}"></button>`:`<button class="mini" data-act="photoAdd" data-k="${k}" aria-label="Añadir ${sideTxt[sd]}"><span class="small muted">+</span></button>`}).join('')}</div>`).join('')}</div>`;
  h+=`<p class="small muted" style="text-align:center;margin:0">🔒 Tus fotos se quedan solo en este iPhone. No se suben a ningún sitio ni entran en la copia de seguridad.</p>`;
  document.getElementById('v-fotos').innerHTML=h;
  const ba=document.getElementById('ba');
  if(ba){const move=x=>{const r=ba.getBoundingClientRect(),p=Math.max(0,Math.min(100,100*(x-r.left)/r.width));document.getElementById('ba-after').style.clipPath=`inset(0 0 0 ${p}%)`;document.getElementById('ba-line').style.left=p+'%'};
    ba.addEventListener('pointerdown',e=>{move(e.clientX);try{ba.setPointerCapture(e.pointerId)}catch(_){}});ba.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e.clientX)});
    document.getElementById('ba-a').addEventListener('change',e=>{baA=+e.target.value;renderFotos()});document.getElementById('ba-b').addEventListener('change',e=>{baB=+e.target.value;renderFotos()});}
}

/* ───── Navegación y eventos ───── */
let curTab='home';
function renderAll(){renderHome();if(curTab==='cal')renderCal();if(curTab==='prog')renderProg();if(curTab==='fotos')renderFotos();if(curTab==='tro')renderTro()}
function showTab(v){curTab=v;['home','cal','prog','fotos','tro'].forEach(x=>document.getElementById('v-'+x).hidden=x!==v);document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));renderAll();scrollTo(0,0);try{localStorage.setItem(KEY+'-tab',v)}catch(e){}}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='closeSheet'&&e.target.closest('[data-stop]')&&!e.target.closest('button[data-act=closeSheet]'))return;
  const a=t.dataset.act,d=t.dataset;
  switch(a){
    case'tab':showTab(d.v);break;
    case'pickDay':selDay=selDay===d.d?null:d.d;if(WK[dowM(new Date())]===d.d)selDay=null;renderHome();break;
    case'start':startWorkout(d.d);break;
    case'ex':showEx(d.id);break;
    case'closeSheet':closeSheet();break;
    case'meow':ac();snd.meow();break;
    case'pause':togglePause();break;
    case'skip':jump(1);break;
    case'prev':jump(-1);break;
    case'quit':quitAsk();break;
    case'quitYes':quitYes();break;
    case'step':doStep(d.k,+d.dir);break;
    case'tag':{const[p,id]=d.k.split(':'),L=logsFor(p)[id];L.tags=L.tags||[];const i=L.tags.indexOf(d.t);i<0?L.tags.push(d.t):L.tags.splice(i,1);t.classList.toggle('on');p==='r'?persistRun():saveSum();break}
    case'feel':feel(d.f);break;
    case'calNav':calM=new Date(calM.getFullYear(),calM.getMonth()+(+d.d),1);renderCal();break;
    case'calDay':calDay(d.k);break;
    case'delAsk':openSheet(`<div class="confirm"><h2>¿Borrar este entreno?</h2><p class="muted" style="margin:0">No se puede deshacer.</p><button class="btn" data-act="closeSheet">Cancelar</button><button class="btn danger" data-act="delYes" data-id="${d.id}">Borrar</button></div>`);break;
    case'delYes':S.sessions=S.sessions.filter(s=>String(s.id)!==d.id);save();closeSheet();renderAll();toast('Entreno borrado');break;
    case'phases':showPhases();break;
    case'photoAdd':photoTarget=d.k;closeSheet();{const inp=document.getElementById('photo-input');inp.value='';inp.click()}break;
    case'photoView':viewPhoto(d.k);break;
    case'photoDelAsk':openSheet(`<div class="confirm"><h2>¿Borrar esta foto?</h2><p class="muted" style="margin:0">No se puede deshacer.</p><button class="btn" data-act="photoView" data-k="${d.k}">Cancelar</button><button class="btn danger" data-act="photoDel" data-k="${d.k}">Borrar</button></div>`);break;
    case'photoDel':delPhoto(d.k).then(()=>{closeSheet();renderAll();toast('Foto borrada')});break;
    case'baSide':baSide=d.s;renderFotos();break;
    case'setName':{const v=(document.getElementById('first-name').value||'').trim();S.settings.name=v;S.named=1;save();closeSheet();renderAll();ac();snd.meow();break}
    case'progEx':progEx=+d.id;renderProg();break;
    case'settings':settings();break;
    case'sw':S.settings[d.k]=!S.settings[d.k];t.classList.toggle('on');save();if(d.k==='sound'&&S.settings.sound){ac();snd.tick()}break;
    case'backup':{const txt=btoa(unescape(encodeURIComponent(JSON.stringify({v:1,settings:S.settings,sessions:S.sessions,trophies:S.trophies}))));const ta=document.getElementById('set-restore');
      const done=()=>toast('Copiado. Pégalo en Notas 📝');
      try{navigator.clipboard.writeText(txt).then(done,()=>{ta.value=txt;ta.select();toast('Selecciona y copia el texto')})}catch(err){ta.value=txt;ta.select();toast('Selecciona y copia el texto')}break}
    case'restore':{try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('set-restore').value.trim()))));if(!o.sessions)throw 0;S.settings=Object.assign(S.settings,o.settings);S.sessions=o.sessions;S.trophies=o.trophies||{};save();closeSheet();renderAll();toast('¡Datos restaurados!')}catch(err){toast('Ese código no es válido. Cópialo entero e inténtalo otra vez.')}break}
    case'wipeAsk':openSheet(`<div class="confirm"><h2>¿Borrar todo?</h2><p class="muted" style="margin:0">Se borrarán todos tus entrenos y trofeos de este iPhone.</p><button class="btn" data-act="closeSheet">Cancelar</button><button class="btn danger" data-act="wipeYes">Sí, borrar todo</button></div>`);break;
    case'wipeYes':S.sessions=[];S.trophies={};save();closeSheet();renderAll();toast('Datos borrados');break;
    case'resume':closeSheet();{const a2=S.active;startWorkout(a2.dk,Object.assign({},a2,a2.paused?{}:{paused:1,left:Math.max(5,(a2.ends-Date.now())/1000)}))}break;
    case'discard':delete S.active;save();closeSheet();break;
  }
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&R){lockScreen();tick()}});

/* ───── Arranque ───── */
renderHome();
loadPhotos();
try{const tb=localStorage.getItem(KEY+'-tab');if(tb&&tb!=='home')showTab(tb)}catch(e){}
const curP=phaseIdx(),started=iso(new Date())>=S.settings.start;
const firstRun=!S.named&&!S.settings.name&&!S.sessions.length;
if(firstRun){openSheet(`<div style="text-align:center">${cat('happy','cat bob" style="width:120px;height:120px')}<h2>¡Hola! Soy Michi 🐾</h2><p class="muted" style="margin:6px 0 0">Te voy a acompañar en cada entreno hasta Navidad. ¿Cómo te llamas?</p></div>
  <label class="field" for="first-name">Tu nombre<input id="first-name" autocomplete="given-name" placeholder="Escribe tu nombre"></label>
  <button class="btn primary" data-act="setName">¡Empezamos! 💕</button>`)}
if(S.seenPhase===undefined){S.seenPhase=curP;save()}
if(!firstRun&&started&&curP>S.seenPhase&&!S.active){
  S.seenPhase=curP;save();const P=PHASES[curP];
  setTimeout(()=>{confetti();openSheet(`<div style="text-align:center">${cat('cheer','cat bob" style="width:120px;height:120px')}<div class="eyebrow">¡Subes de nivel!</div><h2>${P.e} Fase ${curP+1}: ${P.n}</h2><p style="margin:8px 0 0">${P.goal}</p></div><button class="btn" data-act="phases">Ver qué cambia</button><button class="btn primary" data-act="closeSheet">¡Vamos! 💪</button>`)},400);
}else if(S.active&&Date.now()-S.active.start<3*3600e3){
  openSheet(`<div class="confirm"><div class="row">${cat('look','cat')}<h2>Tienes un entreno a medias</h2></div><p class="muted" style="margin:0">${DAYS[S.active.dk].e} ${DAYS[S.active.dk].t}. ¿Lo continuamos donde lo dejaste?</p><button class="btn primary" data-act="resume">Continuar</button><button class="btn" data-act="discard">Descartar</button></div>`);
}else if(S.active){delete S.active;save()}
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
